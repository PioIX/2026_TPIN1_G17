<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agregar Datos - Versión Scaloneta</title>
    <link rel="stylesheet" href="styles/styles.css">
</head>
<body>

    <div class="contenedor-abm">
        
        <h1 class="titulo-pantalla">Agregar Datos</h1>

        <div class="bloque-inputs">
            
            <select id="selectTablaAgregar" class="input-blanco">
                <option value="" disabled selected hidden>Tabla a la que desea agregar datos</option>
                <option value="jugadores">Jugadores de la Scaloneta</option>
                <option value="usuarios">Usuarios del Sistema</option>
            </select>
            
            <input type="text" id="inputDatoNuevo" class="input-blanco" placeholder="Dato nuevo">
            
        </div>

        <div class="bloque-botones">
            <button id="btnEnviarAgregar" class="btn-blanco">AGREGAR DATOS</button>
            <button id="btnVolverAdminAgregar" class="btn-blanco">VOLVER</button>
        </div>

    </div>

    <footer class="pie-creditos">
        <p>Hilario Reddel - Tomas Miranda - Lucas Fabiani - Facundo Poet</p>
        <p class="curso">5B Informática</p>
    </footer>

</body>
</html>
